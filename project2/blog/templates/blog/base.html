<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Website{% endblock %}</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        nav{
            display: flex;
            justify-content: center;
            gap:500px;
            margin-top: 50px;
        }
        nav a{
            text-decoration: none;
            font-size: 50px;
        }
    </style>
</head>
<body>

    <!-- 🔹 Navbar -->
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
    </nav>

    <hr>

    <!-- 🔹 Content area -->
    {% block content %}
    <!-- child pages ka content yahan aayega -->
    {% endblock %}

    <hr>

    <!-- 🔹 Footer -->
    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
