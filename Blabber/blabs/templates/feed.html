<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body>
    <div class="row justify-content-center mt-5">
      <div class="col-12 col-md-6 col-lg-6">
        {% block content %}
          <a href="/create/" class="btn btn-primary">Create</a>
          <a href="/login/" class="btn btn-primary">Login</a>
          <a href="/signup/" class="btn btn-primary">SingUp</a>
          {% for i in posts %}
            <div class="card overflow-auto mb-4">
              <div class="card-headed">
                <h3 class="bg-dark text-white">{{ i.user }}</h3>
              </div>
              <div class="card-body">
                <p>{{ i.text }}</p>
                {% if i.user == request.user %}
                  <div class="text-end">
                    <!-- Yahan hum i.id bhej rahe hain taaki Django ko pata chale kaunsa post hai -->
                    <a href="{% url 'edit_post' i.id %}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a href="{% url 'edit_post' i.id %}" class="btn btn-sm btn-outline-primary">Delete</a>
                  </div>
                {% endif %}
              </div>
            </div>
          {% empty %}
            <p>No Post avilable</p>
          {% endfor %}
        {% endblock %}
      </div>
    </div>
  </body>
</html>
