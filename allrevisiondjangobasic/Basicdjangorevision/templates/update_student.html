{% extends 'base.html' %}
{% block content %}
{% include 'messages.html' %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title mb-4">Update Student</h3>
                    <form method="post" enctype="multipart/form-data" action="{% url 'update_student' student.id %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="std_name" class="form-label">Student Name</label>
                            <input type="text" class="form-control" id="std_name" name="std_name" value="{{ student.std_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="course" class="form-label">Course</label>
                            <select class="form-select" id="course" name="course" required>
                                <option value="">Select Course</option>
                                {% for course in courses %}
                                <option value="{{ course.id }}" {% if student.course.id == course.id %}selected{% endif %}>{{ course.course_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="branch" class="form-label">Branch</label>
                            <select class="form-select" id="branch" name="branch" required>
                                <option value="">Select Branch</option>
                                {% for branch in branches %}
                                <option value="{{ branch.id }}" {% if student.branch.id == branch.id %}selected{% endif %}>{{ branch.branch_name }} ({{ branch.course.course_name }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="semester" class="form-label">Semester</label>
                            <input type="number" class="form-control" id="semester" name="semester" value="{{ student.semester }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="std_roll" class="form-label">Roll Number</label>
                            <input type="text" class="form-control" id="std_roll" name="std_roll" value="{{ student.std_roll }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="std_no" class="form-control">Student Number</label>
                            <input type="text" class="form-control" id="std_no" name="std_no" value="{{ student.std_no }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="std_email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="std_email" name="std_email" value="{{ student.std_email }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="std_address" class="form-label">Address</label>
                            <textarea class="form-control" id="std_address" name="std_address" rows="3" required>{{ student.std_address }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="std_dob" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="std_dob" name="std_dob" value="{{ student.std_dob|date:'Y-m-d' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="std_gender" class="form-label">Gender</label>
                            <select class="form-select" id="std_gender" name="std_gender" required>
                                <option value="">Select Gender</option>
                                <option value="MALE" {% if student.gender == 'MALE' %}selected{% endif %}>Male</option>
                                <option value="FEMALE" {% if student.gender == 'FEMALE' %}selected{% endif %}>Female</option>
                                <option value="OTHER" {% if student.gender == 'OTHER' %}selected{% endif %}>Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="std_image" class="form-label">Upload New Image</label>
                            <input type="file" class="form-control" id="std_image" name="std_image" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-primary">Update Student</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
