{% extends 'base.html' %}
{% block content %}
{% include 'messages.html' %}
<div class="container py-4">
    <h3 class="mb-4">Student Registration Form</h3>
    <form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="std_name" class="form-label">Student Name</label>
            <input type="text" class="form-control" id="std_name" name="std_name" required>
        </div>
        <div class="mb-3">
            <label for="course" class="form-label">Course</label>
            <select class="form-select" id="course" name="course" required>
                <option value="">Select Course</option>
                {% for course in courses %}
                <option value="{{ course.id }}">{{ course.course_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="branch" class="form-label">Branch</label>
            <select class="form-select" id="branch" name="branch" required>
                <option value="">Select Branch</option>
                {% for branch in branches %}
                <option value="{{ branch.id }}">{{ branch.branch_name }} ({{ branch.course.course_name }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="semester" class="form-label">Semester</label>
            <input type="number" class="form-control" id="semester" name="semester" required>
        </div>
        <div class="mb-3">
            <label for="std_roll" class="form-label">Roll Number</label>
            <input type="text" class="form-control" id="std_roll" name="std_roll" required>
        </div>
        <div class="mb-3">
            <label for="std_no" class="form-label">Student Number</label>
            <input type="text" class="form-control" id="std_no" name="std_no" required>
        </div>
        <div class="mb-3">
            <label for="std_email" class="form-label">Email</label>
            <input type="email" class="form-control" id="std_email" name="std_email" required>
        </div>
        <div class="mb-3">
            <label for="std_address" class="form-label">Address</label>
            <textarea class="form-control" id="std_address" name="std_address" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="std_dob" class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="std_dob" name="std_dob" required>
        </div>
        <div class="mb-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-select" id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
                <option value="OTHER">Other</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="std_image" class="form-label">Image</label>
            <input type="file" class="form-control" id="std_image" name="std_image" required>
        </div>
        <button type="submit" class="btn btn-outline-primary">Register</button>
    </form>
</div>
{% endblock %}
