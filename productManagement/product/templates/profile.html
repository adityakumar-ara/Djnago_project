{% extends 'main.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>User Profile</h3>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <!-- Ek default user icon -->
                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="100" class="rounded-circle border">
                    </div>
                    
                    <table class="table">
                        <tr>
                            <th>Username:</th>
                            <td>{{ user.username }}</td>
                        </tr>
                        <tr>
                            <th>Full Name:</th>
                            <td>{{ user_details.first_name }} {{ user_details.last_name }}</td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td>{{ user.email }}</td>
                        </tr>
                        <tr>
                            <th>Phone:</th>
                            <td>{{ user_details.phone }}</td>
                        </tr>
                    </table>
                    
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'product_list' %}" class="btn btn-secondary">Back to Products</a>
                        <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
