<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <form action="" method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Student Name</label>
        <input type="text" name="name" class="form-control" value="{{ student.name }}"
          required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Enrollment Number</label>
        <input type="text" name="e_no" class="form-control" value="{{ student.e_no }}"
          required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Current Image</label>
        <br />
        {% if student.image %}
        <img src="{{ student.image.url }}" alt="Student" style="width: 100px; margin-bottom: 10px" class="img-thumbnail"/>
        {% else %}
        <p class="text-muted">No image uploaded</p>
        {% endif %}
        <input type="file" name="image" class="form-control" />
        <small class="text-muted">Leave empty to keep current image</small>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-success">Update Student</button>
        <a href="{% url 'show_student' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </body>
</html>
